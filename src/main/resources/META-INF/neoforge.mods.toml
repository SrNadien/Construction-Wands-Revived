modLoader = "javafml"
license = "${licence}"

[[mods]]
modId="${modid}"
version="${mod_version}"
displayName="${mod_names}"
displayURL=""
bannerFile="logo.png"
iconFile="icon.png"
authors="${author}"
description="${mod_description}"

[[dependencies.${modid}]]
    modId="neoforge"
    type="required"
    versionRange="${neoforgeVersionRange}"
    ordering = "NONE"
    side="BOTH"
[[dependencies.${modid}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_range_version}"
    ordering = "NONE"
    side="BOTH"

#jei dependency
[[dependencies.${modid}]]
    modId="jei"
    type="optional"
    versionRange="[${jei_version},)"
    ordering="AFTER"
    side="CLIENT"

#rrv dependency -- Reliable Recipe Viewer, convive con JEI
[[dependencies.${modid}]]
    modId="rrv"
    type="optional"
    versionRange="[0,)"
    ordering="AFTER"
    side="CLIENT"

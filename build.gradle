sourceSets.main.java {
    exclude 'nadiendev/constructionwand/containers/handlers/HandlerPortableCell.java'
    exclude 'nadiendev/constructionwand/containers/handlers/HandlerWirelessTerminal.java'
    exclude 'nadiendev/constructionwand/containers/handlers/HandlerWirelessTerminalAE2WTLib.java'
    exclude 'nadiendev/constructionwand/containers/handlers/HandlerWirelessGrid.java'
}


repositories {
    mavenCentral()

    maven {
        url = "https://maven.su5ed.dev/releases"
    }

    maven {
        url = 'https://maven.creeperhost.net'
        content {
            includeGroup("com.refinedmods.refinedstorage")
        }
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
    maven { url "https://maven.shedaniel.me" }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "appeng"
            includeGroup "de.mari_023"
        }
    }
}

